[project]
name = "nurse-scheduling"
version = "0.1.0"
description = "Healthcare scheduling demo — Streamlit + OR-Tools + Claude"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.35.0",
    "anthropic>=0.30.0",
    "ortools>=9.10.4067",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5.0"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "RUF"]
ignore = ["S101", "S102", "E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["S102"]  # exec() is intentional for dynamic OR-Tools code execution

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
